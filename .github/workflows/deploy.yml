name: Generate Team Index

on:
  push:
    branches:
      - main
    paths:
      - 'codes/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

# 只需要 git push 生成的索引(coco-ww 工坊直接读仓库里的 teams.json 和 codes/, 不用 GitHub Pages)
permissions:
  contents: write

# 同一时间只跑一个; 不取消正在跑的(取消在 push 一半会丢索引提交), 后来的排队
concurrency:
  group: "team-index"
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Static Pages & Team JSONs
        run: npm run build

      - name: Commit & Push Updated Static Pages to Main
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add CNAME index.html teams/ teams.json package.json package-lock.json || true
          if git diff --staged --quiet; then
            echo "No changes in generated files to commit."
          else
            # No [skip ci]: Cloudflare Pages skips such commits and would keep serving the previous teams.json.
            # A push made with GITHUB_TOKEN does not trigger this workflow again.
            git commit -m "chore: auto-generate static pages and team JSONs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

